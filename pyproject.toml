[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "minimal-recon"
dynamic = ["version"]
description = "Passive, read-only OSINT toolkit: domains, IPs, web, email, usernames, with a local web interface."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AlexC0906" }]
keywords = ["osint", "reconnaissance", "security", "dns", "footprint", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "certifi",
    "cryptography>=42",
    "dnspython>=2.6,<3",
    "httpx>=0.27,<1",
    "Pillow>=10,<12",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8,<9",
    "pytest-cov>=5,<6",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/AlexC0906/minimal-recon"
Changelog = "https://github.com/AlexC0906/minimal-recon/blob/main/CHANGELOG.md"
Issues = "https://github.com/AlexC0906/minimal-recon/issues"

[project.scripts]
recon = "minimal_recon.cli:app"

[tool.setuptools.dynamic]
version = { attr = "minimal_recon.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
minimal_recon = ["data/*.json", "ui/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
# Typer declares options as function-call defaults by design.
ignore = ["B008"]

[tool.ruff.lint.isort]
force-sort-within-sections = true

[tool.mypy]
python_version = "3.9"
files = ["src"]
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
