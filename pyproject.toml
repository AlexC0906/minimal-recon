[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minimal-recon"
version = "0.1.0"
description = "A modular, read-only OSINT reconnaissance CLI."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "dnspython>=2.6,<3",
    "httpx>=0.27,<1",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<6",
]

[project.scripts]
recon = "minimal_recon.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
