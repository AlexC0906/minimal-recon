[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minimal-recon"
version = "0.1.0"
description = "A modular, read-only OSINT reconnaissance CLI."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "certifi",
    "cryptography>=42",
    "dnspython>=2.6,<3",
    "httpx>=0.27,<1",
    "Pillow>=10,<12",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8,<9",
    "pytest-cov>=5,<6",
    "ruff>=0.6",
]

[project.scripts]
recon = "minimal_recon.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
minimal_recon = ["data/*.json", "ui/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
# Typer declares options as function-call defaults by design.
ignore = ["B008"]

[tool.ruff.lint.isort]
force-sort-within-sections = true

[tool.mypy]
python_version = "3.9"
files = ["src"]
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
